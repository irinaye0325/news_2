<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fl1b Formula 1 fan website">
  <title>Contact | Fl1b</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="site">
    <header>
  <a class="brand" href="index.html"><span>🏎️</span>Fl1b</a>
  <nav aria-label="Main navigation">
    <ul>
      <li><a href="index.html">Home</a></li><li><a href="contact.html" aria-current="page">Contact</a></li>
    </ul>
  </nav>
</header>
    <main>
      
<section aria-labelledby="contact-title">
  <h1 id="contact-title">Contact me</h1>
  <form class="contact-form" action="#" method="post">
    <div class="form-group">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" placeholder="Enter your name" required>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="Enter your email" required>
    </div>
    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Write your message" required></textarea>
    </div>
    <input class="submit-button" type="submit" value="Send message">
  </form>
</section>

    </main>
    <footer>
  <p>© 2026 Fl1b — Formula 1 fan website</p>
  <p><a href="index.html">Home</a> | <a href="about.html">About</a> | <a href="contact.html">Contact</a></p>
</footer>
  </div>
</body>
</html>
